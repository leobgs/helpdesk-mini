# docker-compose.yml
version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: helpdesk_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # depends_on:
    #   - db

  frontend:
    build:
      context: ./frontend
    container_name: helpdesk_frontend
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: helpdesk_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: helpdesk-mini
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
